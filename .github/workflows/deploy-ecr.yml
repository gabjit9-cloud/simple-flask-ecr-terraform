name: CD - Terraform and Push to ECR

on:
  push:
    branches: ["main"]

env:
  ECR_REPOSITORY: simple-flask-ecr-terraform
  IMAGE_TAG: latest

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4
      - name: Verifica file scaricati
        run: |
          pwd
          ls -la
          ls -la terraform/
          git rev-parse HEAD
      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui test
        run: pytest

      - name: Configura credenziali AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configura Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve -var="aws_region=${{ secrets.AWS_REGION }}" -var="ecr_repository_name=$ECR_REPOSITORY"

      - name: Login su Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build immagine Docker
        run: |
          IMAGE_URI=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t $IMAGE_URI .

      - name: Push immagine su Amazon ECR
        run: docker push $IMAGE_URI
